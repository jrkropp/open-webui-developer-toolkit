[project]
name = "openai-responses-manifold"
version = "1.0.0"
description = "OpenAI Responses API Manifold"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Justin Kropp" },
]
# Dependencies listed here are mirrored into the Open WebUI manifest requirements so the host installs them automatically.
dependencies = ["aiohttp", "fastapi","pydantic>=2"]

[project.scripts]
orm = "openai_responses_manifold_cli.main:app"
openai-responses-manifold = "openai_responses_manifold_cli.main:app"

[tool.open_webui_metadata]
open_webui_id = "openai_responses"
open_webui_author_url = "https://github.com/jrkropp"
open_webui_git_url = "https://github.com/jrkropp/open-webui-developer-toolkit/blob/main/functions/pipes/openai_responses_manifold/openai_responses_manifold.py"
open_webui_required_version = "0.6.28"
open_webui_notes = """
NOTES - PLEASE READ:
This is an experimental restructure build that modularizes the pipe under src/ and re-bundles it into a single file.
Use the version in the alpha-preview or main branches instead.
"""

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "typer>=0.12",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "cli"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "I",
  "UP",
  "ASYNC",
  "RUF",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = ["src"]
ignore_missing_imports = true
pretty = true
show_column_numbers = true

[tool.setuptools.packages.find]
where = ["src", "cli"]
exclude = [
  "external*",
  "open-webui*",
  ".tests*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = ""
python_functions = "test_*"
norecursedirs = [
  "dist",
  "build",
  ".workpackages",
]
addopts = """
-ra
--import-mode=importlib
--cov=openai_responses_manifold
--cov-branch
--cov-report=term-missing
--asyncio-mode=auto
--color=yes
"""
pythonpath = [
  "src",
  "../../..",
  "../../../external/open-webui/backend",
]
